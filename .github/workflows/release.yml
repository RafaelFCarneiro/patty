name: Release

# SWITCHED OFF. Every job below is gated on the repository variable RELEASE_ENABLED == 'true', which stays
# unset until the pre-publication scan (ADR-035 step 6) has passed and the first manual npm publish and the
# trusted-publisher setup (step 7) are done. Merging this file publishes nothing; see docs/releasing.md.
#
# On every push to main that contains releasable commits (feat → minor, fix → patch, BREAKING CHANGE → major),
# semantic-release derives the version from Conventional Commits and cuts the tag + GitHub Release; docs/chore/etc.
# merges produce no release. The version is then STAGED on npm (not live until the owner approves it on npmjs.com),
# the image is pushed under its version tags only, and ':latest' moves in a job behind the 'release' environment's
# approval. Gated behind typecheck + tests.
on:
  push:
    branches: [main]

# Release tags are patty-vX.Y.Z (.releaserc.json tagFormat); the v4.x tags are FinTrack history and never match.
env:
  TAG_PREFIX: patty-v

# Avoid overlapping releases if two merges land close together.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, test & stage
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write # create the GitHub Release + git tag
      id-token: write # npm trusted publishing (OIDC): no npm token or secret exists
      issues: write # semantic-release may comment
      pull-requests: write # semantic-release may comment

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags

      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- quality gate (publish only if green) ---
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      # --- release ---
      # A full workflow rerun can find an older release tag already on HEAD; only a tag that appears
      # during this run counts as a release.
      - name: Record tags already on HEAD
        id: tags-before
        run: echo "tag=$(git tag --points-at HEAD "${TAG_PREFIX}*" | sort -V | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # create release + tag, comment
        run: npx semantic-release

      # semantic-release creates the patty-vX.Y.Z tag on HEAD when (and only when) it cuts a release; it has
      # no @semantic-release/git, so HEAD is never moved by a commit.
      - name: Detect released version
        id: version
        env:
          TAG_BEFORE: ${{ steps.tags-before.outputs.tag }}
        run: |
          tag="$(git tag --points-at HEAD "${TAG_PREFIX}*" | sort -V | tail -n1)"
          if [ -n "$tag" ] && [ "$tag" != "$TAG_BEFORE" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#"$TAG_PREFIX"}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      # Stage (not publish): the version is installable only after the owner approves it on npmjs.com
      # (or `npm stage approve <id>`). @semantic-release/npm (npmPublish: false) has already written the version
      # into package.json. Trusted publishing needs a recent npm.
      - name: Stage the npm version
        if: steps.version.outputs.released == 'true'
        run: |
          npm install -g npm@latest
          npm stage publish --access public --registry https://registry.npmjs.org

  image:
    name: Publish container image
    needs: release
    if: vars.RELEASE_ENABLED == 'true' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_PREFIX }}${{ needs.release.outputs.version }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the base image
        id: base
        uses: ./.github/actions/base-image

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rafaelfcarneiro/patty
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            NODE_IMAGE=${{ steps.base.outputs.image }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-latest:
    name: Move the image's latest tag
    needs: [release, image]
    if: vars.RELEASE_ENABLED == 'true' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # The owner's approval gate: this job waits until a required reviewer approves the 'release' environment.
    # Approve it after approving the npm version, so `npx …@latest` and `docker pull …:latest` move together.
    environment: release
    permissions:
      contents: read
      packages: write # retag in ghcr.io

    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at the version
        env:
          IMAGE: ghcr.io/rafaelfcarneiro/patty
          VERSION: ${{ needs.release.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"

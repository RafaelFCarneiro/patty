name: Secret scan

# A separate workflow with no path filter: unlike ci.yml, a Markdown-only change is scanned too.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Scans the commits a push or pull request adds. Known false positives are listed, with a comment each, in
  # .gitleaksignore (the action reads it from the repo root).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists the PR's commits to scan

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the action needs the commit range it scans

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

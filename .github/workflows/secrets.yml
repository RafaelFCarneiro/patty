name: Secret scan

# A separate workflow with no path filter: unlike ci.yml, a Markdown-only change is scanned too.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Scans the exact commit range a push or pull request adds (base..head, however many commits), with the pinned
  # gitleaks image, so the result does not depend on a wrapper's pagination. Known false positives: .gitleaks.toml
  # (patterns) and .gitleaksignore (history fingerprints).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the range's base commit must be present

      - name: Scan the commit range
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push with no usable "before" (a new branch) scans the whole history reachable from the head.
          case "$RANGE_BASE" in ''|0000000000000000000000000000000000000000) range="$RANGE_HEAD" ;; *) range="$RANGE_BASE..$RANGE_HEAD" ;; esac
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git --no-banner --redact --log-opts="$range" /repo

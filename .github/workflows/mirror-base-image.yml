name: Mirror base image

# Copies the Dockerfile's Docker Hub base image (a multi-arch index, registry to registry, no layers pulled) to
# ghcr.io/<owner>/node-mirror so CI and release build FROM it instead of pulling anonymously from Docker Hub, which
# answers 429 to shared runners. The Dockerfile's `ARG NODE_IMAGE` is the single source for which image to copy.
# Builds fall back to Docker Hub when the mirror is missing (see .github/actions/base-image), so this job being
# late or failing never blocks a build — it only makes the build less flaky.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # weekly, to pick up the base image's security rebuilds
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/mirror-base-image.yml

concurrency:
  group: mirror-base-image
  cancel-in-progress: false

jobs:
  mirror:
    name: Copy node base image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the base image
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          upstream="$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)"
          mirror="ghcr.io/${OWNER,,}/node-mirror:${upstream#node:}"
          # Docker Hub itself may answer 429 here too; this job is rare, so back off and retry.
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=https://github.com/${REPO}" \
              --annotation "index:org.opencontainers.image.description=Mirror of docker.io/library/${upstream} for CI and release builds" \
              --tag "$mirror" "docker.io/library/${upstream}"; then
              echo "Mirrored docker.io/library/${upstream} -> ${mirror}"
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying"
            sleep $((attempt * 60))
          done
          echo "::error::Could not mirror docker.io/library/${upstream}"
          exit 1

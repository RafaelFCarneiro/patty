name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  # Scans the full history for committed secrets. Known false positives are listed, with a comment each, in
  # .gitleaksignore (the action reads it from the repo root).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scan walks every commit

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the behavior-change/tests check can find the merge-base

      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Behavior changes ship tests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-tests-changed.mjs

      - name: Type check
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Integration tests + coverage
        run: npm run test:coverage:integration

      - name: Merge coverage reports
        run: node scripts/merge-coverage.mjs

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Runs the image build + smoke test only when something the image is built from changed (see
  # scripts/container-files-changed.sh); otherwise every step below is skipped and the check still reports success.
  # The build is FROM the GHCR mirror of the base image when it exists (.github/actions/base-image), because Docker
  # Hub answers 429 to anonymous pulls from shared runners.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read # pull the base-image mirror

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit must be present to diff against

      - name: Did anything the image is built from change?
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "container=$(scripts/container-files-changed.sh "$BASE_SHA")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.container == 'true'

      - name: Resolve the base image
        id: base
        if: steps.changes.outputs.container == 'true'
        uses: ./.github/actions/base-image

      - name: Build image (linux/amd64, no push)
        if: steps.changes.outputs.container == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: patty:ci
          build-args: NODE_IMAGE=${{ steps.base.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.changes.outputs.container == 'true'
        run: scripts/docker-smoke.sh patty:ci

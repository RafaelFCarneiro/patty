version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Packages that must move in lockstep (exact peer), majors included. First match wins.
      vitest:
        patterns: ['vitest', '@vitest/*']
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
        # 0.x minors can break; each comes as its own PR.
        exclude-patterns: ['@libsql/*']
    ignore:
      # Each has its own planned PR.
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'

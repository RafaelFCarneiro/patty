<style>
/* Dashboard Panel Containers (base: ui/app.css, #164) */
        .panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 1.75rem;
            position: relative;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        /* Loading Spinner Overlay (.loading-overlay/.spinner base: ui/app.css, #164) */
        .loading-overlay {
            right: 0; bottom: 0;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.05);
        }

        /* Shared Header Rows inside panels */
        .panel-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 1rem;
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-title i {
            color: var(--accent-primary);
        }

        /* Premium Buttons (base: ui/app.css, #164) */
        .btn-action-primary {
            border-radius: 8px;
            padding: 0.5rem 1.25rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .btn-action-primary:hover {
            background: var(--accent-secondary);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }

        /* Collapsible Form Styling */
        .panel-form-inline {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
        }

        .panel-form-inline.hidden {
            display: none;
        }

        .form-row {
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        /* base: ui/app.css (#164) */
        .form-control {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.55rem 0.75rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
        }

        .form-control:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
        }

        /* Toast Notifications (.toast-container/.toast base: ui/app.css, #164) */
        .toast-container {
            bottom: 24px;
            right: 24px;
            gap: 8px;
            z-index: 1100;
        }

        .toast {
            background: #0d0f1a;
            padding: 0.85rem 1.25rem;
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            max-width: 320px;
        }

        .toast.error {
            border-left: 3px solid var(--expense-color);
        }

        .toast.error i {
            color: var(--expense-color);
        }

        .toast.success {
            border-left: 3px solid var(--income-color);
        }

        .toast.success i {
            color: var(--income-color);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(20px); }
        }

        /* Premium Tag Capsules Grid layout */
        .tags-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.25rem;
            padding: 0.5rem 0;
            position: relative;
        }

        .tag-pill-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            border-color: rgba(255, 255, 255, 0.12);

            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }

            color: var(--accent-primary);
            font-size: 0.95rem;
            flex-shrink: 0;
        }

            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);

            overflow: hidden;

            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 6px;

            align-items: center;

            text-align: center;
            padding: 3rem 0;
            color: var(--text-dark);
            font-style: italic;
            font-size: 0.88rem;
            grid-column: 1 / -1;
        }

        /* Custom Select component styling */
        .select-container-custom {
            position: relative;
            display: inline-block;
            min-width: 120px;
            user-select: none;
        }

        .select-trigger-custom {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.5rem 2.2rem 0.5rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;

        }

        .select-trigger-custom::after {

            font-weight: 900;
            font-size: 0.7rem;
            color: var(--text-muted);

            right: 12px;
            transition: transform 0.3s ease;
        }

        .select-container-custom.open .select-trigger-custom::after {
            transform: rotate(180deg);
            color: var(--accent-primary);
        }

        .select-options-custom {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;

<header>
            <div class="header-title-area">
                <h1><i class="fa-solid fa-tag"></i> <span data-i18n="tags_title">Gerenciar Tags</span></h1>
                <p data-i18n="tags_subtitle">Gerencie as tags utilizadas para rotular e categorizar suas transações</p>
            </div>
        </header>

        <section class="panel">
            <div class="loading-overlay" id="list-loading">
                <div class="spinner"></div>
            </div>

            <div class="panel-header-row">
                <div class="panel-title">
                    <i class="fa-solid fa-tags"></i> <span data-i18n="panel_title_tags">Tags Ativas</span>
                </div>
                <button type="button" class="btn-action-primary" onclick="toggleAddTagForm()">
                    <i class="fa-solid fa-plus"></i> <span data-i18n="btn_new_tag">Nova Tag</span>
                </button>
            </div>

            <!-- Form: Create New Tag (Hidden/Inline) -->
            <div id="add-tag-form-container" class="panel-form-inline hidden">
                <form id="tag-form" onsubmit="handleCreateTag(event)">
                    <div class="form-row" style="display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 2; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                            <label class="form-label" for="tag-name" data-i18n="label_tag_name">Nome da Tag</label>
                            <input type="text" id="tag-name" class="form-control" placeholder="Ex: trabalho, viagem, reembolso" style="height: 38px; box-sizing: border-box;" required>
                        </div>
                        <div style="display: flex; gap: 0.5rem; height: 38px; align-items: center;">
                            <button type="submit" class="btn-action-primary" style="height: 38px; padding: 0 1.25rem;" data-i18n="btn_save">Salvar</button>
                            <button type="button" class="btn-action-primary" style="height: 38px; padding: 0 1.25rem; background: rgba(255, 255, 255, 0.05); color: var(--text-muted);" onclick="toggleAddTagForm()" data-i18n="btn_cancel">Cancelar</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Grid displaying the tags list -->
            <div class="tags-grid-container" id="tags-list">
                <!-- Populated dynamically -->
            </div>
        </section>

        <div class="toast-container" id="toast-container"></div>

<script>
// State variables
        var tagsList = [];

        // Elements
        var listLoading = document.getElementById('list-loading');
        var tagsListContainer = document.getElementById('tags-list');

        // Toast Helper
        function showToast(message, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
                <span>${escapeHtml(message)}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = "fadeOut 0.4s ease forwards";
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        // Fetch all tags from API
        async function loadTagsData() {
            listLoading.classList.add('active');
            try {
                const res = await fetch('/api/tags');
                if (res.ok) {
                    tagsList = await res.json();
                    tagsList.sort((a, b) => a.name.localeCompare(b.name));
                } else {
                    showToast("Erro ao carregar lista de tags.", "error");
                }
                renderTagsList();
            } catch (err) {
                console.error("Error loading tags:", err);
                showToast("Erro de rede ao carregar tags.", "error");
            } finally {
                listLoading.classList.remove('active');
            }
        }

        // Render tags grid
        function renderTagsList() {
            tagsListContainer.innerHTML = '';
            
            if (tagsList.length === 0) {
                tagsListContainer.innerHTML = `
                    <div class="empty-tags-message" data-i18n="empty_tags_message">
                        Nenhuma tag cadastrada.
                    </div>
                `;
                return;
            }

            tagsList.forEach(tag => {
                const card = document.createElement('div');
                card.className = 'tag-pill-card';
                card.id = `tag-${tag.id}`;
                card.innerHTML = `
                    <div class="tag-pill-info">
                        <i class="fa-solid fa-tag"></i>
                        <span class="tag-pill-name" title="${escapeHtml(tag.name)}">${escapeHtml(tag.name)}</span>
                    </div>
                    <button type="button" class="btn-tag-delete" title="Excluir tag" onclick="handleDeleteTag('${tag.id}', '${escapeJsAttr(tag.name)}')">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                tagsListContainer.appendChild(card);
            });
        }

        // Toggle New Tag Form visibility
        function toggleAddTagForm() {
            const container = document.getElementById('add-tag-form-container');
            container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) {
                document.getElementById('tag-form').reset();
                document.getElementById('tag-name').focus();
            }
        }

        // Handle Form Submission (Create tag)
        async function handleCreateTag(event) {
            event.preventDefault();
            const inputName = document.getElementById('tag-name');
            const name = inputName.value.trim();

            if (!name) {
                showToast("Digite o nome da tag.", "error");
                return;
            }

            listLoading.classList.add('active');
            try {
                const res = await fetch('/api/tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                if (res.ok) {
                    showToast(t('toast_success_tag_created').replace('{name}', name));
                    toggleAddTagForm();
                    await loadTagsData();
                } else {
                    const errData = await res.json();
                    let errMsg = "Erro ao criar tag.";
                    if (errData.error?.code === 'duplicate' || res.status === 409) {
                        errMsg = "Esta tag já existe.";
                    }
                    showToast(errMsg, "error");
                }
            } catch (err) {
                console.error("Error creating tag:", err);
                showToast("Erro de rede ao criar tag.", "error");
            } finally {
                listLoading.classList.remove('active');
            }
        }

        // Handle Delete Tag
        async function handleDeleteTag(id, name) {
            if (!confirm(t('confirm_delete_tag').replace('{name}', name))) {
                return;
            }

            listLoading.classList.add('active');
            try {
                const res = await fetch(`/api/tags/${id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    showToast(t('toast_success_tag_deleted').replace('{name}', name));
                    await loadTagsData();
                } else {
                    showToast("Erro ao excluir tag.", "error");
                }
            } catch (err) {
                console.error("Error deleting tag:", err);
                showToast("Erro de rede ao excluir tag.", "error");
            } finally {
                listLoading.classList.remove('active');
            }
        }

        // Simple HTML Escaping helper
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Escapes a value for safe embedding as a single-quoted JS string literal *inside* an
        // HTML attribute (e.g. onclick="fn('${escapeJsAttr(value)}')"). escapeHtml() alone is not
        // enough here: the browser HTML-decodes the attribute before the JS parser reads it, so an
        // HTML-escaped quote round-trips back into a real quote and still breaks out of the string.
        // Escaping backslash+quote for the JS layer first, then HTML-escaping the result for the
        // attribute layer, survives that decode step correctly for both layers.
        function escapeJsAttr(str) {
            if (!str) return '';
            return escapeHtml(String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        }

var currentLocale = 'en'; // English as default

// Helper to translate in JS
function t(key) {
    const tDict = TRANSLATIONS[currentLocale] || TRANSLATIONS['en'];
    return tDict[key] || key;
}

async function checkLocale() {
    try {
        const res = await fetch('/api/status');
        if (res.ok) {
            const data = await res.json();
            if (data.locale && TRANSLATIONS[data.locale]) {
                currentLocale = data.locale;
            }
        }
    } catch (err) {
        console.error("Failed to read locale preferences:", err);
    }
    translatePage();
}

function translatePage() {
    const tDict = TRANSLATIONS[currentLocale] || TRANSLATIONS['en'];
    
    // 1. Static texts
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (tDict[key]) {
            const icon = el.querySelector('i');
            if (icon) {
                const iconOuter = icon.outerHTML;
                el.innerHTML = iconOuter + ' ' + tDict[key];
            } else {
                el.textContent = tDict[key];
            }
        }
    });

    // 2. Placeholders
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (tDict[key]) {
            el.placeholder = tDict[key];
        }
    });

    // 3. Tooltips
    document.querySelectorAll('[data-i18n-tooltip]').forEach(el => {
        const key = el.getAttribute('data-i18n-tooltip');
        if (tDict[key]) {
            el.setAttribute('data-tooltip', tDict[key]);
        }
    });
    
    // 4. Document title translation
    if (tDict['overview_title'] && document.title.includes("Overview") || document.title.includes("Visão")) {
        // dynamic title update fallback if needed
    }

    // 5. Translate select months
    const monthSelects = [
        document.getElementById('month-select'),
        document.getElementById('start-month-select')
    ];
    monthSelects.forEach(monthSelect => {
        if (monthSelect) {
            const monthKeys = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
            Array.from(monthSelect.options).forEach((opt, idx) => {
                const key = monthKeys[idx];
                if (tDict[key]) {
                    opt.textContent = tDict[key];
                }
            });
        }
    });

    // 6. Translate projection months select options (3, 6, 9, 12 months)
    const hmSelect = document.getElementById('heatmap-months-select');
    if (hmSelect) {
        Array.from(hmSelect.options).forEach(opt => {
            const val = opt.value;
            const key = `months_${val}`;
            if (tDict[key]) {
                opt.textContent = tDict[key];
            }
        });
    }

    // Automatically initialize/refresh custom selects on all pages
    if (typeof initCustomSelects === 'function') {
        initCustomSelects();
    }
}

// Custom Select Component implementation
function initCustomSelects() {
    document.querySelectorAll('select.select-custom').forEach(select => {
        if (select.nextElementSibling && select.nextElementSibling.classList.contains('select-container-custom')) {
            // Already initialized, just sync selected value
            const container = select.nextElementSibling;
            const triggerSpan = container.querySelector('.select-trigger-custom span');
            const selectedOpt = select.options[select.selectedIndex];
            if (selectedOpt && triggerSpan) {
                triggerSpan.textContent = selectedOpt.textContent;
            }
            return;
        }
        select.style.display = 'none';
        const container = document.createElement('div');
        container.className = 'select-container-custom';
        
        // Match specific element custom min-widths
        if (select.id === 'heatmap-months-select') {
            container.style.minWidth = '110px';
        } else if (select.id === 'year-select') {
            container.style.minWidth = '90px';
        } else if (select.id === 'filter-type') {
            container.style.minWidth = '130px';
        }
        
        const trigger = document.createElement('div');
        trigger.className = 'select-trigger-custom';
        const triggerSpan = document.createElement('span');
        trigger.appendChild(triggerSpan);
        container.appendChild(trigger);
        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'select-options-custom';
        container.appendChild(optionsContainer);
        
        function syncSelected() {
            const selectedOpt = select.options[select.selectedIndex] || select.options[0];
            if (selectedOpt) {
                triggerSpan.textContent = selectedOpt.textContent;
                Array.from(optionsContainer.children).forEach(child => {
                    if (child.getAttribute('data-value') === select.value) {
                        child.classList.add('selected');
                    } else {
                        child.classList.remove('selected');
                    }
                });
            }
        }
        
        function populateOptions() {
            optionsContainer.innerHTML = '';
            Array.from(select.options).forEach(opt => {
                const optDiv = document.createElement('div');
                optDiv.className = 'select-option-custom';
                optDiv.textContent = opt.textContent;
                optDiv.setAttribute('data-value', opt.value);
                optDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    select.value = opt.value;
                    select.dispatchEvent(new Event('change'));
                    syncSelected();
                    container.classList.remove('open');
                });
                optionsContainer.appendChild(optDiv);
            });
        }
        
        populateOptions();
        syncSelected();
        
        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = container.classList.contains('open');
            document.querySelectorAll('.select-container-custom').forEach(el => {
                el.classList.remove('open');
            });
            if (!isOpen) {
                populateOptions();
                syncSelected();
                container.classList.add('open');
                setTimeout(() => {
                    const selectedEl = optionsContainer.querySelector('.select-option-custom.selected');
                    if (selectedEl) {
                        const itemHeight = selectedEl.offsetHeight || 36;
                        optionsContainer.scrollTop = Math.max(0, selectedEl.offsetTop - itemHeight);
                    }
                }, 10);
            }
        });
        
        select.parentNode.insertBefore(container, select.nextSibling);
        select.addEventListener('change', syncSelected);
        
        // Watch for dynamic options updates
        const observer = new MutationObserver(() => {
            syncSelected();
        });
        observer.observe(select, { childList: true, subtree: true });
        
        setTimeout(syncSelected, 200);
        setTimeout(syncSelected, 1000);
    });
    
    // Global click listener to close options dropdowns when clicking outside
    if (!window.customSelectGlobalBound) {
        window.customSelectGlobalBound = true;
        document.addEventListener('click', () => {
            document.querySelectorAll('.select-container-custom').forEach(el => {
                el.classList.remove('open');
            });
        });
    }
}

        loadTagsData();
            checkLocale();

// ADR-027 Live-update listener
window.onAppDataChanged = function(entities) {
    var affected = entities.some(function(tag) {
        return ['tag'].indexOf(tag) !== -1;
    });
    if (affected) {
        console.log("tags refetching due to entity change:", entities);
        loadTagsData();
    }
};

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinTrack</title>
    <!-- Google Fonts: the CSS2 API response is generated per requesting User-Agent (different
         @font-face src formats/URLs for different browsers), so there is no single fixed response
         body an SRI hash could pin — hashing today's response would break the stylesheet for any
         browser whose UA gets a different variant, and Google may rotate the response at any time
         regardless. No SRI is applied here for that reason; this is the accepted, documented gap
         (#165). Chart.js/Flatpickr/Font Awesome below serve one fixed file per version and are
         pinned + SRI'd. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" referrerpolicy="no-referrer" />
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      referrerpolicy="no-referrer"
      crossorigin="anonymous"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Flatpickr CSS -->
    <link
      rel="stylesheet"
      referrerpolicy="no-referrer"
      crossorigin="anonymous"
      integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt"
      href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css"
    />
    <link
      rel="stylesheet"
      referrerpolicy="no-referrer"
      crossorigin="anonymous"
      integrity="sha384-heUUtXw0Djj2DElfLOVPlASSWFKNL3JDY6s3FEqQD03GYyWOeophY5DsfEG40sYX"
      href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/themes/dark.css"
    />
    <!-- Custom layout CSS -->
    <link rel="stylesheet" href="/ui/assets/app.css" />

    <!-- Chart.js CDN -->
    <script
      defer
      referrerpolicy="no-referrer"
      crossorigin="anonymous"
      integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt"
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
    ></script>
    <!-- Flatpickr JS -->
    <script
      defer
      referrerpolicy="no-referrer"
      crossorigin="anonymous"
      integrity="sha384-5JqMv4L/Xa0hfvtF06qboNdhvuYXUku9ZrhZh3bSk8VXF0A/RuSLHpLsSV9Zqhl6"
      src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"
    ></script>
    <script
      defer
      referrerpolicy="no-referrer"
      crossorigin="anonymous"
      integrity="sha384-agbVpcY312cNMSL1b3CUo060bj9FmbwUX8HUCNSE17+jOU/en4yz3w9ro9IWVusF"
      src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/pt.js"
    ></script>
  </head>
  <body>
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-wallet" style="color: var(--accent-primary);"></i>
      </div>
      <nav class="sidebar-menu" id="dashboard-menu" aria-label="Dashboards">
        <p class="state">Loading menu…</p>
      </nav>
      
      <!-- Bottom options menu -->
      <div class="sidebar-more-container" id="more-container">
        <button class="sidebar-more-btn" id="more-btn" aria-label="More options" aria-haspopup="true" aria-controls="more-dropdown" aria-expanded="false">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
        <div class="sidebar-more-dropdown" id="more-dropdown">
          <!-- Dynamically populated or static dropdown links -->
        </div>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <main id="content" aria-live="polite">
      <p class="state">Loading…</p>
    </main>

    <script defer src="/ui/assets/app.js"></script>
  </body>
</html>

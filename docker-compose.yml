services:
  neo4j:
    image: neo4j:5-community
    container_name: fintrack-neo4j
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/fintrack123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: fintrack-backend
    ports:
      - "3001:3001"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-fintrack123}
      PORT: "3001"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
